<!DOCTYPE html>
<html>
<head>
    <title>Dataset Analysis Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f4f4;
        }

        .box{
            background:white;
            padding:20px;
            border-radius:12px;
            margin-top:20px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.1);
        }

        .criteria-box{
            background:#eef2ff;
            padding:15px;
            border-radius:10px;
            margin-top:10px;
        }
    </style>
</head>
<body>

<div class="container mt-4">

    <div class="box">

        <h2 class="text-center mb-4">Dataset Criteria Detection</h2>

        <div class="row">

            <div class="col-md-6">
                <div class="criteria-box">
                    <h4>📌 Numerical Criteria</h4>

                    <ul>
                        {% for col in numerical_columns %}
                        <li>{{col}}</li>
                        {% endfor %}
                    </ul>
                </div>
            </div>

            <div class="col-md-6">
                <div class="criteria-box">
                    <h4>📌 Categorical Criteria</h4>

                    <ul>
                        {% for col in categorical_columns %}
                        <li>{{col}}</li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
</html>
